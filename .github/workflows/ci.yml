name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The first push has no Astro project yet, so every later step is skipped until it does.
      - name: Check the project exists
        id: gate
        run: |
          if [ -f package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Types, lint, unit tests, copy
        if: steps.gate.outputs.ready == 'true'
        run: npm run check

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        run: npm run build

      - name: SEO, links and budgets
        if: steps.gate.outputs.ready == 'true'
        run: npm run check:site

      - name: Install browsers
        if: steps.gate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        if: steps.gate.outputs.ready == 'true'
        run: npm run test:e2e

      - name: Lighthouse
        if: steps.gate.outputs.ready == 'true'
        run: npm run lhci

      - name: Keep test results and screenshots
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
