routeId: guideAliasRules
lang: ru
title: "Правила Алиаса: как играть в Элиас, кратко и понятно"
description: "Правила игры Алиас (Элиас) коротко: команды, таймер, что нельзя говорить и как считать очки. Плюс как играть на телефоне и футбольный вариант."
kicker: Правила
datePublished: "2026-11-07"
dateModified: "2026-11-07"
short: "Алиас (Элиас) — командная игра в слова. Игрок объясняет слово, не называя его, команда угадывает на время, а каждое угаданное слово приносит очко. Команды ходят по очереди, объясняющий меняется каждый раунд, а побеждает команда, которая первой дойдёт до финиша. Нужны четыре человека или больше, набор слов и таймер."
sections:
  - id: rules
    h: Правила коротко
    list:
      - Игроки делятся на команды минимум по два человека.
      - Команды ходят по очереди. В каждом ходе один игрок объясняет, остальные угадывают.
      - Нельзя называть само слово и однокоренные слова. Синонимы, антонимы и подсказки — можно.
      - Ход ограничен таймером. В настольной игре это песочные часы.
      - Каждое угаданное слово — очко. Во многих изданиях за пропуск снимают очко.
      - Побеждает команда, которая первой дойдёт до финиша.
    note: Правила в разных изданиях отличаются, поэтому договорись с компанией о деталях до начала игры.
  - id: need
    h: Что понадобится
    p:
      - "Четыре человека или больше, набор слов, таймер и способ считать очки. В настольной игре есть карточки со словами, песочные часы и игровое поле. Телефон справится со всем сразу. Хочешь играть на бумаге — распечатай наш [бесплатный список футбольных слов](words) и разрежь его на карточки."
  - id: turn
    h: Как проходит ход
    p:
      - "Объясняющий берёт карточку и запускает таймер. Он объясняет первое слово, команда выкрикивает варианты, и как только кто-то угадал, он переходит к следующему. Время вышло — ход закончен: команда считает слова, и ходит следующая."
      - "В следующем раунде объясняет другой игрок команды. За игру каждый успеет побыть объясняющим, даже самые тихие."
  - id: cant
    h: Что нельзя говорить
    list:
      - Само слово.
      - "Однокоренные слова: для «вратаря» нельзя говорить «ворота»."
      - Многие компании запрещают ещё и называть слово по буквам или переводить его на другой язык. Это домашние правила — о них договариваются заранее.
    after:
      - "Всё остальное можно: синонимы, антонимы, примеры и подсказки. Можно ли показывать жестами — решает компания, поэтому обсуди это до первого хода."
  - id: score
    h: Как считать очки
    p:
      - "Каждое угаданное слово — очко. Во многих изданиях за каждый пропуск снимают очко, чтобы объясняющий не сдавался слишком быстро. В настольной игре очки двигают фишку команды по полю, и побеждает та, что первой доберётся до финиша."
      - "Играешь без поля? Договорись о цели заранее, например 30 очков, или назначь число раундов и сложи результаты."
  - id: three
    h: Как играть втроём или вдвоём
    house: Домашние правила
    p:
      - "Втроём каждый играет за себя: один объясняет, двое соревнуются, кто угадает первым, и угадавший забирает очко. Объясняющий меняется каждый ход."
      - "Вдвоём играют вместе против таймера: объясняют по очереди и стараются побить свой рекорд."
  - id: tips
    h: Как объяснять, чтобы угадывали
    list:
      - "Начни с категории: «это футболист», «это город», «это на кухне»."
      - "Используй противоположности и сравнения: «не холодный, а…», «как автобус, только на рельсах»."
      - Вместо определения приведи пример или вспомни известный момент.
      - Слово не идёт — пропусти его. Таймер ждать не будет.
  - id: phone
    h: Как играть на телефоне
    p:
      - "Телефон заменяет карточки, таймер и блокнот для счёта. Хватит одного: объясняющий держит его, отмечает касанием каждое угаданное слово и передаёт телефон следующей команде. Никто не тасует карточки и не следит за песочными часами."
      - "Ещё больше игр, для которых хватит одного телефона, — в статье [игры для компании на одном телефоне](guideOnePhone)."
  - id: football
    h: Футбольный вариант
    p:
      - "Мы делаем Bombardiro — футбольный Алиас для iPhone и iPad. Все слова — про футбол: игроки, клубы, стадионы, легенды, тактика и трофеи, чемпионаты мира. Почти 1700 слов на русском, английском и армянском. Пара правил отличается от классики:"
    compare:
      cols: ["", Классический Алиас, Bombardiro]
      rows:
        - [Пропущенные слова, Часто минус очко, Просто остаются неотмеченными]
        - [Победа, Кто первым дошёл до финиша, "Цель — 51, 101, 151 или 201 очко"]
        - [Ходы, Игра может закончиться посреди круга, "Круг доигрывается, у всех поровну ходов"]
        - [Слова, На любые темы, "Только футбол, «Легко» или «Сложно»"]
    app: true
