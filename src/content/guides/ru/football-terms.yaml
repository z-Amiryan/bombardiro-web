routeId: guideGlossary
lang: ru
title: "Футбольные термины и их значение: словарь на трёх языках"
description: "Главные футбольные термины простыми словами, а ещё на английском и армянском: офсайд, пенальти, хет-трик, ВАР и другие."
kicker: Словарь
datePublished: "2026-11-07"
dateModified: "2026-11-07"
short: "Футбольные термины — это слова, которыми описывают правила, позиции, тактику и эпизоды матча. Здесь 73 главных термина: офсайд, пенальти, хет-трик, ВАР, гегенпрессинг и другие. У каждого — короткое объяснение простыми словами и перевод на английский и армянский."
termHeads: [Термин, English, Հայերեն, Что значит]
sections:
  - id: kak-chitat
    h: Как пользоваться словарём
    p:
      - "Термины разбиты на четыре темы: правила, позиции, тактика и игровые эпизоды. Английские и армянские названия взяты из наших наборов слов — так эти термины звучат в футбольном репортаже на этих языках. У каждого термина есть своя ссылка: например, [офсайд](guideGlossary#ofsayd) или [гегенпрессинг](guideGlossary#gegenpressing)."
      - "Хочешь проверить, кто в компании лучше знает футбол? Объясняй эти слова на время, не называя их, — это и есть Алиас. Правила — в статье [как играть в Алиас](guideAliasRules), а готовый список для распечатки — на странице [футбольных слов](words)."
  - id: pravila
    h: "Правила игры"
    p:
      - "Как назначают удары, когда показывают карточки и сколько длится матч."
    terms:
      - { id: ofsayd, level: easy, index: 2, ru: "офсайд", en: "offside", hy: "օֆսայդ", def: "Положение вне игры: в момент паса партнёра атакующий ближе к линии ворот соперника, чем мяч и предпоследний защитник, и участвует в игре." }
      - { id: passivnyy-ofsayd, level: hard, index: 1, ru: "пассивный офсайд", en: "passive offside", hy: "պասիվ օֆսայդ", def: "Игрок стоит в офсайде, но не участвует в атаке и не мешает сопернику, поэтому нарушения нет." }
      - { id: penalti, level: easy, index: 1, ru: "пенальти", en: "penalty", hy: "պենալտի", def: "Удар с одиннадцатиметровой отметки за нарушение защищающейся команды в своей штрафной площади." }
      - { id: uglovoy, level: easy, index: 3, ru: "угловой", en: "corner", hy: "անկյունային", def: "Удар из угла поля, когда мяч после касания защищающейся команды ушёл за её линию ворот мимо ворот." }
      - { id: shtrafnoy, level: easy, index: 4, ru: "штрафной", en: "free kick", hy: "տուգանային հարված", def: "Удар после нарушения, которым можно сразу забить гол." }
      - { id: svobodnyy-udar, level: easy, index: 5, ru: "свободный удар", en: "indirect free kick", hy: "ազատ հարված", def: "Удар после нарушения, которым нельзя забить напрямую: до гола мяча должен коснуться ещё один игрок." }
      - { id: aut, level: easy, index: 8, ru: "аут", en: "out", hy: "աութ", def: "Выход мяча за боковую линию поля." }
      - { id: vbrasyvanie, level: easy, index: 31, ru: "вбрасывание", en: "throw-in", hy: "ներնետում", def: "Возобновление игры после аута: мяч бросают двумя руками из-за головы." }
      - { id: udar-ot-vorot, level: easy, index: 32, ru: "удар от ворот", en: "goal kick", hy: "հարված դարպասից", def: "Возобновление игры, когда мяч после касания атакующих ушёл за линию ворот мимо ворот." }
      - { id: fol, level: easy, index: 22, ru: "фол", en: "foul", hy: "ֆոլ", def: "Нарушение правил против соперника: толчок, подножка, удар или задержка руками." }
      - { id: igra-rukoy, level: easy, index: 62, ru: "игра рукой", en: "handball", hy: "ձեռքի խաղ", def: "Нарушение, когда полевой игрок касается мяча рукой намеренно или неестественно расставив руки." }
      - { id: preimushchestvo, level: hard, index: 0, ru: "преимущество", en: "advantage", hy: "առավելության կանոն", def: "Судья не останавливает игру после фола, если команде, против которой нарушили, выгоднее продолжить атаку." }
      - { id: zhyoltaya-kartochka, level: easy, index: 7, ru: "жёлтая карточка", en: "yellow card", hy: "դեղին քարտ", def: "Предупреждение игроку за грубость, неспортивное поведение или споры с судьёй." }
      - { id: vtoroy-zhyoltyy, level: hard, index: 13, ru: "второй жёлтый", en: "second yellow", hy: "երկրորդ դեղին", def: "Вторая жёлтая карточка в одном матче, после которой игрока удаляют." }
      - { id: krasnaya-kartochka, level: easy, index: 6, ru: "красная карточка", en: "red card", hy: "կարմիր քարտ", def: "Удаление игрока до конца матча: команда доигрывает в меньшинстве." }
      - { id: fol-posledney-nadezhdy, level: hard, index: 12, ru: "фол последней надежды", en: "last-man foul", hy: "վերջին հույսի խախտում", def: "Нарушение, которым игрок лишает соперника явной возможности забить. Обычно за него удаляют." }
      - { id: spornyy-myach, level: hard, index: 2, ru: "спорный мяч", en: "dropped ball", hy: "վիճելի գնդակ", def: "Возобновление игры после остановки без нарушения: судья отдаёт мяч команде, которая владела им последней." }
      - { id: var, level: hard, index: 3, ru: "ВАР", en: "VAR", hy: "ՎԱՐ", def: "Видеопомощь судье: арбитры у мониторов проверяют голы, пенальти, удаления и ошибки в определении игрока." }
      - { id: tekhnologiya-gola, level: hard, index: 5, ru: "технология гола", en: "goal-line technology", hy: "գոլի տեխնոլոգիա", def: "Система, которая мгновенно сообщает судье, пересёк ли мяч линию ворот полностью." }
      - { id: obratnyy-pas-vrataryu, level: hard, index: 9, ru: "обратный пас вратарю", en: "back-pass rule", hy: "հետ փոխանցում դարպասապահին", def: "Вратарь не может взять в руки мяч, который партнёр намеренно отдал ему ногой." }
      - { id: kompensirovannoe-vremya, level: easy, index: 65, ru: "компенсированное время", en: "stoppage time", hy: "ավելացված ժամանակ", def: "Минуты, которые судья добавляет в конце тайма за остановки игры." }
      - { id: dopolnitelnoe-vremya, level: easy, index: 17, ru: "дополнительное время", en: "extra time", hy: "լրացուցիչ ժամանակ", def: "Два тайма по 15 минут, если матч на вылет закончился вничью." }
      - { id: seriya-penalti, level: easy, index: 18, ru: "серия пенальти", en: "penalty shootout", hy: "պենալտիների շարք", def: "Удары с одиннадцатиметровой отметки по очереди, если победитель не выявлен и после дополнительного времени." }
      - { id: zatyazhka-vremeni, level: easy, index: 64, ru: "затяжка времени", en: "time wasting", hy: "ժամանակի ձգձգում", def: "Намеренное замедление игры, чтобы удержать счёт. За него показывают жёлтую карточку." }
  - id: pozitsii
    h: "Позиции и роли"
    p:
      - "Кто где играет на поле и кто судит матч."
    terms:
      - { id: vratar, level: easy, index: 12, ru: "вратарь", en: "goalkeeper", hy: "դարպասապահ", def: "Игрок, который защищает ворота и может брать мяч руками в своей штрафной площади." }
      - { id: zashchitnik, level: easy, index: 49, ru: "защитник", en: "defender", hy: "պաշտպան", def: "Игрок обороны, который мешает соперникам подобраться к воротам." }
      - { id: poluzashchitnik, level: easy, index: 51, ru: "полузащитник", en: "midfielder", hy: "կիսապաշտպան", def: "Игрок середины поля, который связывает оборону и атаку." }
      - { id: napadayushchiy, level: easy, index: 50, ru: "нападающий", en: "forward", hy: "հարձակվող", def: "Игрок, чья главная задача — забивать голы." }
      - { id: opornik, level: hard, index: 33, ru: "опорник", en: "defensive midfielder", hy: "պաշտպանական կիսապաշտպան", def: "Опорный полузащитник: играет перед защитниками, отбирает мяч и начинает атаки." }
      - { id: pleymeyker, level: hard, index: 34, ru: "плеймейкер", en: "playmaker", hy: "փլեյմեյքեր", def: "Игрок, который организует атаки точными передачами." }
      - { id: chelnok, level: hard, index: 36, ru: "челнок", en: "box-to-box", hy: "բոքս-թու-բոքս", def: "Полузащитник, который успевает и в оборону, и в атаку, пробегая поле от штрафной до штрафной." }
      - { id: vingbek, level: hard, index: 32, ru: "вингбек", en: "wing-back", hy: "վինգբեկ", def: "Крайний игрок в схемах с тремя центральными защитниками: отвечает за весь фланг в обороне и в атаке." }
      - { id: libero, level: hard, index: 31, ru: "либеро", en: "libero", hy: "լիբերո", def: "Свободный защитник, который страхует остальных позади линии обороны." }
      - { id: lozhnaya-devyatka, level: hard, index: 30, ru: "ложная девятка", en: "false nine", hy: "կեղծ իննյակ", def: "Центральный нападающий, который отходит в середину поля, чтобы увести за собой защитников и освободить место партнёрам." }
      - { id: targetmen, level: hard, index: 35, ru: "таргетмен", en: "target man", hy: "թարգեթմեն", def: "Высокий нападающий, на которого играют длинными передачами: он выигрывает мяч головой и скидывает партнёрам." }
      - { id: kapitan, level: easy, index: 52, ru: "капитан", en: "captain", hy: "ավագ", def: "Игрок с повязкой, который представляет команду перед судьёй." }
      - { id: zapasnoy, level: easy, index: 54, ru: "запасной", en: "substitute", hy: "պահեստային", def: "Игрок, который начинает матч на скамейке и может выйти на замену." }
      - { id: osnovnoy-sostav, level: easy, index: 55, ru: "основной состав", en: "starting xi", hy: "հիմնական կազմ", def: "Одиннадцать игроков, которые выходят на поле с первых минут." }
      - { id: sudya, level: easy, index: 13, ru: "судья", en: "referee", hy: "մրցավար", def: "Главный арбитр матча: следит за правилами, назначает удары и показывает карточки." }
      - { id: bokovoy-sudya, level: easy, index: 60, ru: "боковой судья", en: "linesman", hy: "կողային մրցավար", def: "Помощник главного судьи у боковой линии: фиксирует ауты и офсайды." }
  - id: taktika
    h: "Тактика"
    p:
      - "Как команды расставляются, защищаются и атакуют."
    terms:
      - { id: formatsiya, level: easy, index: 56, ru: "формация", en: "formation", hy: "դասավորվածություն", def: "Расстановка игроков на поле, например 4-4-2 или 4-3-3: сколько защитников, полузащитников и нападающих." }
      - { id: pressing, level: easy, index: 45, ru: "прессинг", en: "pressing", hy: "պրեսինգ", def: "Активное давление на соперника с мячом, чтобы быстрее его отобрать." }
      - { id: gegenpressing, level: hard, index: 41, ru: "гегенпрессинг", en: "gegenpressing", hy: "գեգենպրեսինգ", def: "Прессинг сразу после потери мяча, чтобы вернуть его, пока соперник не начал атаку." }
      - { id: kontrataka, level: easy, index: 46, ru: "контратака", en: "counter-attack", hy: "հակագրոհ", def: "Быстрая атака сразу после отбора, пока соперник не успел вернуться в оборону." }
      - { id: pozitsionnaya-ataka, level: hard, index: 59, ru: "позиционная атака", en: "positional attack", hy: "դիրքային գրոհ", def: "Неторопливая атака с долгим владением мячом против плотной обороны." }
      - { id: nizkiy-blok, level: hard, index: 19, ru: "низкий блок", en: "low block", hy: "ցածր բլոկ", def: "Оборона всей командой у своей штрафной площади." }
      - { id: avtobus, level: hard, index: 21, ru: "автобус", en: "the bus", hy: "ավտոբուս", def: "Шутливое название глухой обороны у своих ворот: команда «ставит автобус»." }
      - { id: vysokaya-liniya, level: hard, index: 20, ru: "высокая линия", en: "high line", hy: "բարձր գիծ", def: "Защитники стоят далеко от своих ворот, чтобы сжать игру и ловить соперников в офсайд." }
      - { id: ofsaydnaya-lovushka, level: hard, index: 4, ru: "офсайдная ловушка", en: "offside trap", hy: "օֆսայդի թակարդ", def: "Защитники одновременно выходят вперёд, чтобы нападающий соперника оказался в офсайде." }
      - { id: personalnaya-opeka, level: hard, index: 16, ru: "персональная опека", en: "man marking", hy: "անհատական հսկողություն", def: "Защита, при которой каждый игрок отвечает за конкретного соперника." }
      - { id: zonnaya-zashchita, level: hard, index: 17, ru: "зонная защита", en: "zonal marking", hy: "զոնային պաշտպանություն", def: "Защита, при которой каждый игрок отвечает за свой участок поля." }
      - { id: tiki-taka, level: hard, index: 40, ru: "тики-така", en: "tiki-taka", hy: "տիկի-տակա", def: "Стиль игры короткими быстрыми передачами с долгим контролем мяча." }
      - { id: katenachcho, level: hard, index: 42, ru: "катеначчо", en: "catenaccio", hy: "կատենաչո", def: "Оборонительная система родом из Италии: надёжная защита и быстрые контратаки." }
      - { id: totalnyy-futbol, level: hard, index: 43, ru: "тотальный футбол", en: "total football", hy: "տոտալ ֆուտբոլ", def: "Стиль, в котором игроки постоянно меняются позициями, и каждый может и защищаться, и атаковать." }
      - { id: standartnoe-polozhenie, level: hard, index: 23, ru: "стандартное положение", en: "set piece", hy: "ստանդարտ դիրք", def: "Возобновление игры после остановки: угловой, штрафной, свободный удар, аут или пенальти." }
  - id: epizody
    h: "Игровые эпизоды"
    p:
      - "Голы, передачи и приёмы, о которых говорят после матча."
    terms:
      - { id: khet-trik, level: easy, index: 38, ru: "хет-трик", en: "hat-trick", hy: "հեթ-տրիկ", def: "Три гола одного игрока в одном матче." }
      - { id: dubl, level: easy, index: 39, ru: "дубль", en: "brace", hy: "դուբլ", def: "Два гола одного игрока в одном матче." }
      - { id: avtogol, level: easy, index: 37, ru: "автогол", en: "own goal", hy: "ավտոգոլ", def: "Гол, который игрок забил в собственные ворота." }
      - { id: golevaya-peredacha, level: easy, index: 36, ru: "голевая передача", en: "assist", hy: "գոլային փոխանցում", def: "Пас, после которого партнёр забил гол." }
      - { id: naves, level: easy, index: 34, ru: "навес", en: "cross", hy: "կախովի փոխանցում", def: "Передача по высокой дуге с фланга в штрафную площадь." }
      - { id: prostrel, level: easy, index: 35, ru: "прострел", en: "low cross", hy: "սուր փոխանցում", def: "Низкая быстрая передача с фланга вдоль ворот." }
      - { id: razrezayushchiy-pas, level: hard, index: 26, ru: "разрезающий пас", en: "through ball", hy: "կտրող փոխանցում", def: "Передача между защитниками, которая выводит партнёра один на один с вратарём." }
      - { id: stenochka, level: hard, index: 46, ru: "стеночка", en: "one-two", hy: "պատով խաղ", def: "Комбинация в два касания: игрок отдаёт пас партнёру и сразу получает мяч обратно на ходу." }
      - { id: zabeganie, level: hard, index: 27, ru: "забегание", en: "overlap", hy: "շրջանցող վազք", def: "Игрок обегает партнёра с мячом по флангу, чтобы получить передачу." }
      - { id: podkat, level: easy, index: 42, ru: "подкат", en: "slide tackle", hy: "պադկատ", def: "Отбор мяча в скольжении по газону." }
      - { id: perekhvat, level: easy, index: 44, ru: "перехват", en: "interception", hy: "որսում", def: "Отбор мяча на пути передачи соперника." }
      - { id: dobivanie, level: hard, index: 51, ru: "добивание", en: "follow-up shot", hy: "կրկնահարված", def: "Удар по мячу, который отскочил от вратаря, штанги или защитника." }
      - { id: rikoshet, level: hard, index: 50, ru: "рикошет", en: "deflection", hy: "ռիկոշետ", def: "Изменение полёта мяча после случайного касания игрока." }
      - { id: simulyatsiya, level: easy, index: 61, ru: "симуляция", en: "simulation", hy: "սիմուլյացիա", def: "Попытка обмануть судью: игрок изображает фол, которого не было." }
      - { id: rabona, level: hard, index: 18, ru: "рабона", en: "rabona", hy: "ռաբոնա", def: "Удар или передача, при которых бьющая нога заходит за опорную." }
      - { id: fint, level: hard, index: 62, ru: "финт", en: "feint", hy: "ֆինտ", def: "Обманное движение, чтобы обыграть соперника." }
