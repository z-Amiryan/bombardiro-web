routeId: guideOnePhone
lang: ru
title: "Игры для компании на одном телефоне: 7 идей без интернета"
description: "Во что играть компанией, если есть один телефон и нет интернета: объяснялки, ролевые игры и футбольный вариант. Сколько нужно людей и как играть."
kicker: Игры для компании
datePublished: "2026-11-07"
dateModified: "2026-11-07"
short: "Если в компании один телефон и нет интернета, выбирай объяснялки и ролевые игры: Алиас, Шляпу, Крокодила, Мафию, Шпиона и «Кто я?». Телефон в них служит таймером, списком слов или раздаёт роли, так что сеть не нужна. Большинству этих игр хватает четырёх человек, а раунд занимает несколько минут."
sections:
  - id: alias
    h: Алиас
    p:
      - "Команды ходят по очереди: один игрок объясняет слова, не называя их, остальные угадывают, пока не кончится время. Каждое угаданное слово — очко. Классическая игра для компании любого размера. Подробно — в статье [правила Алиаса](guideAliasRules), а готовые карточки можно распечатать со страницы [футбольных слов](words)."
    facts:
      - [Игроков, "от 4, команды по 2+"]
      - [Телефон, таймер и список слов]
      - [Ход, около минуты]
  - id: shlyapa
    h: Шляпа
    p:
      - "Каждый пишет несколько слов на бумажках, их складывают в шляпу. Игроки разбиваются на пары и по очереди объясняют партнёру слова из шляпы, пока идёт таймер. Когда шляпа опустела, побеждает пара, которая угадала больше всех."
      - "Нет бумаги — пусть каждый заранее впишет свои слова в общую заметку на телефоне."
    facts:
      - [Игроков, "от 4, по парам"]
      - [Телефон, таймер и счёт]
      - [Игра, около получаса]
  - id: krokodil
    h: Крокодил
    p:
      - "Один игрок показывает слово жестами и мимикой — без звуков и без слов. Остальные угадывают. Кто угадал, тот показывает следующее. Говорить не нужно, поэтому играть легко даже в шумной компании."
    facts:
      - [Игроков, от 3]
      - [Телефон, показывает слово ведущему и держит время]
      - [Ход, 1–2 минуты]
  - id: mafia
    h: Мафия
    p:
      - "Ведущий тайно раздаёт роли: мирные жители, мафия, иногда доктор и комиссар. Ночью мафия выбирает жертву, днём город обсуждает и голосует, кого выгнать. Мирные побеждают, если вычислят всю мафию, мафия — если сравняется с ними числом."
      - "Телефон передают по кругу, и каждый тайком смотрит свою роль. Ведущему он заменяет блокнот: кто жив, кто голосовал и за кого."
    facts:
      - [Игроков, от 6]
      - [Телефон, раздаёт роли и помогает ведущему]
      - [Игра, 20–40 минут]
  - id: shpion
    h: Шпион
    p:
      - "Все игроки видят на телефоне одно и то же место, например «стадион» или «самолёт», кроме одного — шпиона. Он не знает, где все находятся. Игроки по очереди задают друг другу вопросы о месте: ответы должны выдать своих, но не подсказать шпиону. В конце все голосуют, кто шпион, а шпион пытается назвать место."
    facts:
      - [Игроков, 3–10]
      - [Телефон, по очереди показывает каждому его карточку]
      - [Раунд, 5–10 минут]
  - id: kto-ya
    h: «Кто я?»
    p:
      - "Игрок держит телефон у лба экраном к остальным: на экране имя известного человека или персонажа. Он задаёт вопросы, на которые можно ответить «да» или «нет», и пытается понять, кто он. Остальные отвечают честно и не подсказывают."
      - "Слова можно заранее записать в заметку и листать. Чтобы было сложнее, ограничь число вопросов."
    facts:
      - [Игроков, от 3]
      - [Телефон, показывает загаданное имя]
      - [Ход, пара минут]
  - id: football
    h: "Футбольный вариант: Bombardiro"
    p:
      - "Мы делаем Bombardiro — футбольную игру в слова для iPhone и iPad. Это Алиас, где все слова про футбол: игроки, клубы, стадионы, легенды, тактика и трофеи, чемпионаты мира. От двух до четырёх команд играют на одном телефоне: приложение раздаёт карточки, держит время, свистит и считает голы. Работает без интернета и бесплатно."
    facts:
      - [Команд, 2–4]
      - [Телефон, "карточки, таймер, свисток и табло"]
      - [Ход, "30, 60, 90 или 120 секунд"]
    app: true
  - id: tips
    h: Как подготовить телефон к игре
    list:
      - Заряди телефон и прибавь яркость, чтобы экран видела вся команда.
      - Включи режим «Не беспокоить», чтобы уведомление не закрыло загаданное слово.
      - "До первого хода договорись с компанией, как передаётся телефон: по кругу или от команды к команде."
      - Веди счёт прямо в телефоне — так в конце не будет споров.
