routeId: guideAliasRules
lang: hy
title: "Ալիասի կանոնները՝ ինչպես խաղալ"
description: "Ալիասի կանոնները պարզ բառերով՝ թիմեր, ժամանակ, ինչ չի կարելի ասել և ինչպես հաշվել միավորները։ Նաև ինչպես խաղալ հեռախոսով։"
kicker: Կանոններ
datePublished: "2026-11-07"
dateModified: "2026-11-07"
short: "Ալիասը թիմային բառախաղ է։ Մեկ խաղացողը նկարագրում է բառը՝ առանց այն ասելու, իսկ թիմը գուշակում է ժամանակի դեմ։ Յուրաքանչյուր գուշակված բառ միավոր է։ Թիմերը խաղում են հերթով, և հաղթում է այն թիմը, որն առաջինը կհասնի ավարտին։ Պետք է չորս կամ ավելի մարդ, բառեր և ժամանակաչափ։"
sections:
  - id: rules
    h: Կանոնները կարճ
    list:
      - Խաղացողները բաժանվում են թիմերի՝ առնվազն երկու հոգով։
      - Թիմերը խաղում են հերթով։ Մեկը նկարագրում է, մյուսները գուշակում են։
      - Չի կարելի ասել բառը կամ նույն արմատով բառեր։ Հոմանիշները, հականիշներն ու հուշումները թույլատրված են։
      - Հերթը սահմանափակված է ժամանակով։ Սեղանի խաղում դա ավազի ժամացույց է։
      - Յուրաքանչյուր գուշակված բառ միավոր է։ Շատ տարբերակներում բաց թողած բառի համար միավոր են հանում։
      - Հաղթում է այն թիմը, որն առաջինը կհասնի ավարտին։
    note: Տարբեր տարբերակներում կանոնները տարբեր են, ուստի նախապես պայմանավորվիր ընկերներիդ հետ։
  - id: need
    h: Ինչ է պետք
    p:
      - "Չորս կամ ավելի մարդ, բառեր, ժամանակաչափ և միավորները հաշվելու միջոց։ Հեռախոսը կարող է անել այս ամենը։ Եթե ուզում ես խաղալ թղթով, տպիր մեր [ֆուտբոլային բառերի ցանկը](words) և կտրիր այն քարտերի։"
  - id: turn
    h: Ինչպես է անցնում հերթը
    p:
      - "Նկարագրողը միացնում է ժամանակաչափը և նկարագրում է առաջին բառը։ Թիմը բարձրաձայն գուշակում է։ Երբ ինչ-որ մեկը ճիշտ է ասում, նկարագրողն անցնում է հաջորդ բառին։"
      - "Երբ ժամանակն ավարտվում է, թիմը հաշվում է բառերը, և հերթն անցնում է հաջորդ թիմին։ Հաջորդ շրջանում նկարագրում է թիմի մեկ ուրիշ խաղացող։ Այսպես բոլորը կնկարագրեն գոնե մեկ անգամ։"
  - id: cant
    h: Ինչ չի կարելի ասել
    list:
      - Բառը։
      - Նույն արմատով բառեր։ Օրինակ՝ «դարպասապահ» բառի համար չի կարելի ասել «դարպաս»։
      - Շատ ընկերություններ արգելում են նաև բառը տառերով ասել կամ թարգմանել։ Դա տնային կանոն է, ուստի պայմանավորվիր նախապես։
    after:
      - "Մնացած ամեն ինչ թույլատրված է՝ հոմանիշներ, հականիշներ, օրինակներ և հուշումներ։"
  - id: score
    h: Ինչպես հաշվել միավորները
    p:
      - "Յուրաքանչյուր գուշակված բառ մեկ միավոր է։ Շատ տարբերակներում բաց թողած բառի համար մեկ միավոր են հանում, որպեսզի նկարագրողը արագ չհանձնվի։"
      - "Եթե խաղում ես առանց խաղատախտակի, նախապես որոշիր նպատակը, օրինակ՝ 30 միավոր։ Կամ որոշիր շրջանների թիվը և գումարիր արդյունքները։"
  - id: three
    h: Ինչպես խաղալ երեքով կամ երկուսով
    house: Տնային կանոններ
    p:
      - "Երեքով ամեն մեկը խաղում է իր համար։ Մեկը նկարագրում է, երկուսը մրցում են, թե ով առաջինը կգուշակի։ Գուշակողը ստանում է միավորը։"
      - "Երկուսով խաղում են միասին ժամանակի դեմ՝ հերթով նկարագրում են և փորձում գերազանցել իրենց ռեկորդը։"
  - id: phone
    h: Ինչպես խաղալ հեռախոսով
    p:
      - "Հեռախոսը փոխարինում է քարտերին, ժամանակաչափին և հաշվին։ Մեկ հեռախոսը բավական է։ Նկարագրողը պահում է այն, սեղմում է գուշակված բառը և հեռախոսը տալիս է հաջորդ թիմին։"
  - id: football
    h: Ֆուտբոլային տարբերակ
    p:
      - "Մենք ստեղծում ենք Bombardiro-ն՝ ֆուտբոլային Ալիաս iPhone-ի և iPad-ի համար։ Բոլոր բառերը ֆուտբոլի մասին են՝ խաղացողներ, ակումբներ, մարզադաշտեր, լեգենդներ, մարտավարություն և գավաթներ, աշխարհի գավաթներ։ Խաղում կա մոտ 1700 բառ հայերեն, ռուսերեն և անգլերեն։ Մի քանի կանոն տարբերվում է դասականից։"
    compare:
      cols: ["", Դասական Ալիաս, Bombardiro]
      rows:
        - [Բաց թողած բառեր, Հաճախ մինուս միավոր, Պարզապես չեն նշվում]
        - [Հաղթանակ, Առաջինը ավարտին, "51, 101, 151 կամ 201 միավոր"]
        - [Հերթեր, Խաղը կարող է ավարտվել շրջանի մեջտեղում, "Շրջանը խաղարկվում է մինչև վերջ, և բոլորը խաղում են հավասար անգամ"]
        - [Բառեր, Ցանկացած թեմա, "Միայն ֆուտբոլ՝ «Հեշտ» կամ «Դժվար»"]
    app: true
